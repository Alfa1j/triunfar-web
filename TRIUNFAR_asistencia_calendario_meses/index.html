<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="api/supabase.js"></script>
  <script src="api/estudiantes.js"></script>
  <script src="app.js"></script>

  <!-- INTERCEPTOR DIRECTO NEON POSTGRESQL -->
  <script>
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button") || e.target.closest("input[type='submit']");
      if (!btn) return;

      const txt = (btn.innerText || btn.value || "").toLowerCase().trim();

      if (txt.includes("guardar") || txt.includes("crear") || txt.includes("aceptar")) {
        setTimeout(async () => {
          const inputs = Array.from(document.querySelectorAll("input:not([type='hidden']):not([type='submit']), select, textarea"))
            .filter(i => i.offsetWidth > 0 && i.offsetHeight > 0);

          if (inputs.length === 0) return;

          const datos = {};
          inputs.forEach((input, index) => {
            if (input.value.trim() !== "") {
              const clave = input.name || input.id || input.placeholder || `campo_${index + 1}`;
              datos[clave] = input.value.trim();
            }
          });

          if (Object.keys(datos).length > 0) {
            console.log("Interceptor -> Enviando datos a Neon:", datos);
            try {
              const res = await fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datos })
              });
              const data = await res.json();
              if (res.ok && data.success) {
                alert("¡ÉXITO! Guardado en Neon PostgreSQL.");
              }
            } catch (err) {
              console.error("Error al enviar a Neon:", err);
            }
          }
        }, 150);
      }
    }, true);
  </script>
</body>
</html>
