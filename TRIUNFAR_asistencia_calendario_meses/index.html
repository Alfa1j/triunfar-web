<script src="app.js"></script>
  <script>
    // Interceptor directo dentro de index.html
    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button") || e.target.closest("input[type='submit']");
      if (!btn) return;

      const texto = (btn.innerText || btn.value || "").toLowerCase().trim();

      if (texto.includes("guardar") || texto.includes("crear") || texto.includes("aceptar")) {
        // Capturar los inputs del modal o formulario visible
        setTimeout(async () => {
          const inputs = Array.from(document.querySelectorAll("input:not([type='hidden']):not([type='submit']), select, textarea"))
            .filter(input => input.offsetWidth > 0 && input.offsetHeight > 0);

          if (inputs.length === 0) return;

          const datos = {};
          inputs.forEach((input, index) => {
            if (input.value.trim() !== "") {
              const clave = input.name || input.id || input.placeholder || `campo_${index + 1}`;
              datos[clave] = input.value.trim();
            }
          });

          if (Object.keys(datos).length > 0) {
            try {
              const respuesta = await fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
              });

              const resultado = await respuesta.json();
              if (respuesta.ok && resultado.success) {
                alert("¡ÉXITO! Guardado en Neon PostgreSQL.");
                window.location.reload();
              } else {
                alert("Error en el servidor Neon: " + (resultado.error || "No se pudo guardar"));
              }
            } catch (err) {
              console.error("Error al conectar con la API:", err);
            }
          }
        }, 150);
      }
    }, true);
  </script>
</body>
</html>
